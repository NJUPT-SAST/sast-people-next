name: CI/CD Pipeline

on:
  push:
    branches:
      - v3.0
      - v3.1
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  test:
    name: Test & Build
    needs: quality
    uses: ./.github/workflows/test.yml
