name: Deploy

# ============================================================================
# Docker Build + Private TCR + SSH Deployment
# ============================================================================
# This workflow builds, publishes, and deploys an image for a commit that has
# already passed the protected pull request checks. Runtime health and rollback
# remain part of deployment; repository tests are not repeated here. Tagged
# deployments additionally require a successful Release workflow for the same
# commit before they can publish an image.
#
# Requires the following secrets:
#   - SERVER_HOST:                Target server IP/hostname
#   - SERVER_USER:                SSH user
#   - SSH_PRIVATE_KEY:            SSH private key for authentication
#   - NEXT_PUBLIC_SENTRY_DSN:     Build-time public Sentry DSN
#   - TCR_USERNAME:               Tencent Cloud account ID / UIN (organization secret)
#   - TCR_PASSWORD:               TCR registry login password (organization secret)
#
# Runtime secrets, including the database URL, are read from
# /data/sast-people-next/.env on the server. They are not written from GitHub
# Secrets during deployment.
#
# The TCR repository is private. The deployment step logs in with an ephemeral
# Docker config only for the pull, then removes that config before it exits.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      database_backup_ref:
        description: "Optional external production backup/snapshot reference; a local backup is created automatically when omitted"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVICE_NAME: sast-people-next
  REGISTRY_PREFIX: sast
  TCR_HOST: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: sast

jobs:
  deploy:
    name: Docker Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.ref == 'refs/heads/v3' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Verify tagged release checks
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --json conclusion \
            --jq 'any(.[]; .conclusion == "success")' \
            | grep -qx true; then
            echo "A successful Release workflow is required before deploying tag $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Get short Git commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to TCR
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$TCR_PASSWORD" | docker login "$TCR_HOST" --username "$TCR_USERNAME" --password-stdin

      - name: Build and push image to TCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ${{ env.TCR_HOST }}/${{ env.TCR_NAMESPACE }}/${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: |
            type=gha,scope=app
            type=gha
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migration image to TCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.TCR_HOST }}/${{ env.TCR_NAMESPACE }}/${{ env.SERVICE_NAME }}:${{ steps.vars.outputs.sha_short }}-migrator
          cache-from: |
            type=gha,scope=migrator
            type=gha
          cache-to: type=gha,mode=max,scope=migrator

      - name: Log out from TCR
        if: always()
        run: |
          docker logout "$TCR_HOST" || true

      - name: Sync Docker Compose file
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SERVICE_DIR="/data/${{ env.SERVICE_NAME }}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$SERVICE_DIR'"

          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o Compression=no \
            docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:$SERVICE_DIR/"

      - name: Deploy on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          DATABASE_BACKUP_REF: ${{ inputs.database_backup_ref }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TCR_USERNAME,TCR_PASSWORD,DATABASE_BACKUP_REF,DEPLOY_RUN_ID
          script: |
            set -e

            SERVICE_DIR="/data/${{ env.SERVICE_NAME }}"
            IMAGE_NAME="${{ env.REGISTRY_PREFIX }}/${{ env.SERVICE_NAME }}"
            TCR_HOST="${{ env.TCR_HOST }}"
            REMOTE_IMAGE="${{ env.TCR_HOST }}/${{ env.TCR_NAMESPACE }}/${{ env.SERVICE_NAME }}"
            NEW_VERSION_TAG="${{ steps.vars.outputs.sha_short }}"

            cd ${SERVICE_DIR}

            echo "=========================================="
            echo "Deploying version: ${NEW_VERSION_TAG}"
            echo "=========================================="

            echo ""
            echo "[1/9] Pulling private images from TCR..."
            DOCKER_CONFIG=$(mktemp -d)
            cleanup_docker_config() {
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup_docker_config EXIT

            printf '%s' "$TCR_PASSWORD" \
              | docker --config "$DOCKER_CONFIG" login "$TCR_HOST" \
                  --username "$TCR_USERNAME" --password-stdin

            for i in 1 2 3; do
              if docker --config "$DOCKER_CONFIG" pull "${REMOTE_IMAGE}:${NEW_VERSION_TAG}"; then
                break
              fi
              echo "  Pull failed (${i}/3); retrying in 10 seconds..."
              sleep 10
            done
            docker image inspect "${REMOTE_IMAGE}:${NEW_VERSION_TAG}" >/dev/null 2>&1 || {
              echo "Image pull failed; aborting deployment."
              exit 1
            }
            docker tag "${REMOTE_IMAGE}:${NEW_VERSION_TAG}" "${IMAGE_NAME}:${NEW_VERSION_TAG}"
            for i in 1 2 3; do
              if docker --config "$DOCKER_CONFIG" pull "${REMOTE_IMAGE}:${NEW_VERSION_TAG}-migrator"; then
                break
              fi
              echo "  Migration image pull failed (${i}/3); retrying in 10 seconds..."
              sleep 10
            done
            docker image inspect "${REMOTE_IMAGE}:${NEW_VERSION_TAG}-migrator" >/dev/null 2>&1 || {
              echo "Migration image pull failed; aborting deployment."
              exit 1
            }
            docker tag "${REMOTE_IMAGE}:${NEW_VERSION_TAG}-migrator" "${IMAGE_NAME}:${NEW_VERSION_TAG}-migrator"

            echo ""
            echo "[2/9] Checking runtime .env..."
            if [ ! -f .env ]; then
              echo "Missing ${SERVICE_DIR}/.env"
              echo "Create it on the server before deploying. docker-compose.yml reads it through env_file."
              exit 1
            fi
            chmod 600 .env

            echo ""
            EXTERNAL_BACKUP_REF="${DATABASE_BACKUP_REF:-}"
            if [ -n "$EXTERNAL_BACKUP_REF" ]; then
              case "$EXTERNAL_BACKUP_REF" in
                *[!a-zA-Z0-9._-]*)
                  echo "Invalid external database backup reference: ${EXTERNAL_BACKUP_REF}" >&2
                  exit 1
                  ;;
              esac
              echo "External database backup reference: ${EXTERNAL_BACKUP_REF}"
            else
              echo "No external backup reference supplied; using the verified local backup below."
            fi
            LOCAL_BACKUP_REF="local-${NEW_VERSION_TAG}-$(date -u +%Y%m%dT%H%M%SZ)-run-${DEPLOY_RUN_ID:-manual}"
            case "$LOCAL_BACKUP_REF" in
              ""|*[!a-zA-Z0-9._-]*)
                echo "Generated invalid local database backup reference: ${LOCAL_BACKUP_REF}" >&2
                exit 1
                ;;
            esac

BACKUP_DIR="${SERVICE_DIR}/backups"
BACKUP_FILE="${LOCAL_BACKUP_REF}.dump"
BACKUP_RETENTION_DAYS=14
if [ -e "$BACKUP_DIR" ] && [ ! -d "$BACKUP_DIR" ]; then
  echo "Backup path exists but is not a directory: ${BACKUP_DIR}" >&2
  exit 1
fi
mkdir -p "$BACKUP_DIR"
chmod 700 "$BACKUP_DIR" 2>/dev/null || true
test -w "$BACKUP_DIR" || {
  echo "Backup directory is not writable by the deployment user: ${BACKUP_DIR}" >&2
  exit 1
}

            echo ""
            echo "[3/9] Creating database backup (${LOCAL_BACKUP_REF})..."
            docker run --rm \
              --network postgres \
              --env-file .env \
              --user "$(id -u):$(id -g)" \
              -e "BACKUP_FILE=${BACKUP_FILE}" \
              -v "${BACKUP_DIR}:/backup" \
              postgres:16-alpine \
              sh -c 'pg_dump "$DATABASE_MIGRATION_URL" --format=custom --file="/backup/$BACKUP_FILE"'
            test -s "${BACKUP_DIR}/${BACKUP_FILE}"
            docker run --rm \
              --network postgres \
              -e "BACKUP_FILE=${BACKUP_FILE}" \
              -v "${BACKUP_DIR}:/backup:ro" \
              postgres:16-alpine \
              sh -c 'pg_restore --list "/backup/$BACKUP_FILE" >/dev/null'
            echo "Database backup created at ${BACKUP_DIR}/${BACKUP_FILE}"
            echo "Removing local backups older than ${BACKUP_RETENTION_DAYS} days..."
            find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.dump' \
              ! -name "$BACKUP_FILE" -mtime "+${BACKUP_RETENTION_DAYS}" -print -delete

            echo ""
            echo "[4/9] Applying database migrations..."
            if ! docker run --rm \
              --name sast-people-next-migrate \
              --env-file .env \
              --network postgres \
              "${IMAGE_NAME}:${NEW_VERSION_TAG}-migrator"; then
              echo "Database migration failed; application image was not activated."
              exit 1
            fi

            echo ""
            echo "[5/9] Verifying application database permissions..."
            if ! docker run --rm \
              --name sast-people-next-permission-check \
              --env-file .env \
              --network postgres \
              "${IMAGE_NAME}:${NEW_VERSION_TAG}-migrator" \
              node scripts/check-db-permissions.mjs; then
              echo "Application database permission check failed; application image was not activated."
              exit 1
            fi

            echo ""
            echo "[6/9] Rotating image tags..."
            if docker image inspect "${IMAGE_NAME}:current" >/dev/null 2>&1; then
              if docker image inspect "${IMAGE_NAME}:backup" >/dev/null 2>&1; then
                echo "  Removing old backup image..."
                docker rmi "${IMAGE_NAME}:backup"
              fi
              echo "  Tagging current as backup..."
              docker tag "${IMAGE_NAME}:current" "${IMAGE_NAME}:backup"
            else
              echo "  First deployment, skipping backup rotation"
            fi

            echo "  Tagging new image (${NEW_VERSION_TAG}) as current..."
            docker tag "${IMAGE_NAME}:${NEW_VERSION_TAG}" "${IMAGE_NAME}:current"

            echo ""
            echo "[7/9] Starting service..."
            docker compose up -d --remove-orphans

            echo ""
            echo "[8/9] Health check (timeout: 120s)..."
            HEALTHY=0
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' sast-people-next 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=1
                echo "  [$i/24] Service is healthy!"
                break
              fi
              echo "  [$i/24] status=$STATUS, waiting 5s..."
              sleep 5
            done

            if [ $HEALTHY -eq 0 ]; then
              echo ""
              echo "=========================================="
              echo "!! HEALTH CHECK FAILED -- ROLLING BACK !!"
              echo "=========================================="
              echo ""
              echo "--- Last 40 lines of container logs ---"
              docker logs --tail 40 sast-people-next || true
              echo "----------------------------------------"
              echo "--- Health check diagnostics ---"
              docker inspect --format='{{json .State.Health}}' sast-people-next 2>/dev/null || echo "(inspect failed)"
              echo ""
              echo "--- Direct health test inside container ---"
              docker exec sast-people-next wget -O /dev/null http://127.0.0.1:3003/health 2>&1 || true
              echo "----------------------------------------"

              if docker image inspect "${IMAGE_NAME}:backup" >/dev/null 2>&1; then
                echo ""
                echo "Rolling back to backup image..."
                docker tag "${IMAGE_NAME}:backup" "${IMAGE_NAME}:current"
                docker compose up -d --remove-orphans

                echo "Waiting for rollback to stabilize..."
                sleep 10
                ROLLBACK_STATUS=$(docker inspect --format='{{.State.Health.Status}}' sast-people-next 2>/dev/null || echo "unknown")
                echo "Rollback health status: $ROLLBACK_STATUS"
              else
                echo "No backup image found -- cannot rollback!"
              fi

              echo ""
              echo "Removing failed image..."
              docker rmi "${IMAGE_NAME}:${NEW_VERSION_TAG}" || true

              echo ""
              echo "DEPLOY FAILED. Rolled back to previous version."
              exit 1
            fi

            echo ""
            echo "[9/9] Cleaning up..."
            docker rmi "${REMOTE_IMAGE}:${NEW_VERSION_TAG}" || true
            docker rmi "${REMOTE_IMAGE}:${NEW_VERSION_TAG}-migrator" || true
            docker rmi "${IMAGE_NAME}:${NEW_VERSION_TAG}-migrator" || true

            echo "  Pruning old version images (keep latest 3)..."
            docker image ls --format '{{.Tag}}' "${IMAGE_NAME}" \
              | grep -v -E '^(current|backup|latest)$' \
              | tail -n +4 \
              | xargs -r -I {} docker rmi "${IMAGE_NAME}:{}"
            docker image prune -f

            echo ""
            echo "=========================================="
            echo "Deploy complete. Running version: ${NEW_VERSION_TAG}"
            echo "=========================================="
