name: Test Suite

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SESSION_SECRET: ci-session-secret
  EMAIL_WEBHOOK_SECRET: ci-email-webhook-secret
  LINK_USE_MOCK: "true"
  LINK_LOGIN_FEISHU_TEST_MOCK: "true"
  PLAYWRIGHT_TEST_MODE: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Feishu notification script tests
        run: node --test scripts/feishu-notification-utils.node-test.mjs
      - name: Run unit tests with coverage
        run: pnpm test:coverage
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: coverage/

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://sast:sast@localhost:5432/sastpeople_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sastpeople_test
          POSTGRES_USER: sast
          POSTGRES_PASSWORD: sast
        options: >-
          --health-cmd "pg_isready -U sast -d sastpeople_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

  # Keep this check name stable because v3 branch protection requires it.
  unit:
    name: Unit Tests
    needs: [jest, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify test jobs
        env:
          JEST_RESULT: ${{ needs.jest.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$JEST_RESULT" != "success" ] || [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "Jest result: $JEST_RESULT"
            echo "PostgreSQL integration result: $INTEGRATION_RESULT"
            exit 1
          fi

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Next.js application
        run: pnpm build
        env:
          NEXT_PUBLIC_MOCK: true

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://sast:sast@localhost:5432/sastpeople
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sastpeople
          POSTGRES_USER: sast
          POSTGRES_PASSWORD: sast
        options: >-
          --health-cmd "pg_isready -U sast -d sastpeople"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Seed E2E fixture data
        run: pnpm db:seed:demo
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
