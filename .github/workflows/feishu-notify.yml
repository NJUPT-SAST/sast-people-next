name: Development Notifications

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, review_requested, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  issues:
    types: [opened, reopened, closed, assigned]
  release:
    types: [published]
  workflow_run:
    workflows: ["CI/CD Pipeline", "Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull_request_target exposes repository secrets. This workflow only reads
    # GitHub event data and checks out the trusted default branch; it must never
    # check out, run, or install content from the PR head branch.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'Deploy' ||
      (github.event.workflow_run.name == 'CI/CD Pipeline' && github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: Checkout notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send notification
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_NOTIFY_CHAT_ID: ${{ secrets.FEISHU_NOTIFY_CHAT_ID }}
        run: node scripts/send-feishu-notification.mjs
