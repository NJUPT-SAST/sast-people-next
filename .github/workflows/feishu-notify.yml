name: Development Notifications

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  issues:
    types: [opened, reopened, closed, assigned]
  release:
    types: [published]
  workflow_run:
    workflows: ["CI/CD Pipeline", "Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Send Feishu Notification
    runs-on: ubuntu-latest
    # Notifications always execute the script that is already merged into the
    # default branch. Event data still comes from the triggering PR, Issue, or
    # workflow run, but an unmerged branch cannot change notification behavior.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'Deploy' ||
      (github.event.workflow_run.name == 'CI/CD Pipeline' && github.event.workflow_run.conclusion == 'failure')

    steps:
      - name: Checkout notification script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send notification
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_NOTIFY_CHAT_ID: ${{ secrets.FEISHU_NOTIFY_CHAT_ID }}
        run: node scripts/send-feishu-notification.mjs
